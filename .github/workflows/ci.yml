name: ci
# Repos of the Smart-Warhouse org live side by side in one workspace folder (docs/ backend/ dashboard/ landing/
# mobile/ robot/ ai/). Jobs that need a sibling check it out next to this repo, so relative lookups work as on a laptop.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
